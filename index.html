<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ajeet Weather Hub</title>
<link rel="stylesheet" href="main.css">
</head>
<body>
<div class="container">
<div class="card">
<h1>🌍 Ajeet Weather Hub</h1>

<div class="search-box-area">
<input type="text" class="search-box" placeholder="Enter city name">
<button class="search-btn">Search</button>
</div>

<div class="weather-card">
<h2 class="city">Delhi, IN</h2>
<p class="date">Today</p>
<div class="icon">⛅</div>
<h1 class="temp">30°C</h1>
<p class="weather">Cloudy</p>
<p class="feels-like">Feels like: 32°C</p>

<div class="extra-info">
<div class="box">
<p>💧 Humidity</p>
<h3 class="humidity">--%</h3>
</div>

<div class="box">
<p>💨 Wind</p>
<h3 class="wind">-- km/h</h3>
</div>
</div>
</div>
</div>
<script src="main.js"></script>
</body>
</html>
